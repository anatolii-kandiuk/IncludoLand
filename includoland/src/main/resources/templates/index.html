<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IncludoLand</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

  <div th:replace="~{include/navbar :: navbar}"></div>

  <main class="container hero">
    <div class="row">
      <div class="col-md-8 mx-auto text-center">
        <h1 class="display-5 fw-bold" th:text="#{index.title}">Ласкаво просимо до IncludoLand</h1>
        <p class="lead mb-4" th:text="#{index.subtitle}">Платформа для інклюзивного навчання та розвитку.</p>
        <div th:if="${username != null}">
          <p class="mb-3" th:text="#{index.loggedInAs} + ' ' + ${username}">Увійшли як користувач</p>
          <a class="btn btn-outline-primary rounded-pill" th:href="@{/dashboard}" th:text="#{index.dashboard}">Перейти до панелі</a>
        </div>
        <div th:if="${username == null}">
          <a class="btn btn-primary rounded-pill me-2" th:href="@{/register}" th:text="#{index.getStarted}">Почати</a>
          <a class="btn btn-outline-secondary rounded-pill" th:href="@{/login}" th:text="#{index.logIn}">Увійти</a>
        </div>
      </div>
    </div>

    <section class="activities-section mt-5">
      <h2 class="activities-title text-center" th:text="#{index.activities}">Активності</h2>
      <div class="activity-list">
        <a th:each="type : ${contentTypes}"
           th:href="@{/activities/{slug}(slug=${#strings.toLowerCase(type.name())})}"
           th:classappend="${type.name() == 'ARTICULATION'} ? 'activity-card-blue' : (${type.name() == 'MATH'} ? 'activity-card-orange' : (${type.name() == 'WORD_PUZZLE'} ? 'activity-card-green' : (${type.name() == 'SENTENCE_PUZZLE'} ? 'activity-card-teal' : 'activity-card-purple')))"
           class="activity-card">
          <span class="activity-icon">
            <i class="bi"
               th:classappend="${type.name() == 'ARTICULATION'} ? ' bi-mic' : (${type.name() == 'MATH'} ? ' bi-calculator' : (${type.name() == 'WORD_PUZZLE' || type.name() == 'SENTENCE_PUZZLE'} ? ' bi-puzzle' : ' bi-sport'))"></i>
          </span>
          <span class="activity-text" th:text="#{${'activity.' + #strings.toLowerCase(type.name())}}">TYPE</span>
        </a>
      </div>
    </section>
  </main>

  <div th:replace="~{include/footer :: footer}"></div>

</body>
</html>
