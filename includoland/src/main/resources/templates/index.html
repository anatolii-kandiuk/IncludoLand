<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IncludoLand</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

  <div th:replace="include/navbar :: navbar"></div>

  <main class="container hero">
    <div class="row">
      <div class="col-md-8 mx-auto text-center">
        <h1 class="display-5 fw-bold">Welcome to IncludoLand</h1>
        <p class="lead mb-4">A place for inclusive educational content and collaboration.</p>
        <div th:if="${username != null}">
          <p class="mb-3">Logged in as <strong th:text="${username}">User</strong></p>
          <a class="btn btn-outline-primary rounded-pill" th:href="@{/dashboard}">Go to Dashboard</a>
        </div>
        <div th:if="${username == null}">
          <a class="btn btn-primary rounded-pill me-2" th:href="@{/register}">Get Started</a>
          <a class="btn btn-outline-secondary rounded-pill" th:href="@{/login}">Log in</a>
        </div>
      </div>
    </div>

    <section class="activities-section mt-5">
      <h2 class="activities-title">Активності</h2>
      <div class="activity-list">
        <a href="#" class="activity-card activity-card-green">
          <span class="activity-icon"><i class="bi bi-puzzle"></i></span>
          <span class="activity-text">ПАЗЛИ СЛІВ</span>
        </a>
        <a href="#" class="activity-card activity-card-teal">
          <span class="activity-icon"><i class="bi bi-bullseye"></i></span>
          <span class="activity-text">УВАГА</span>
        </a>
        <a href="#" class="activity-card activity-card-blue">
          <span class="activity-icon"><i class="bi bi-mic"></i></span>
          <span class="activity-text">АРТИКУЛЯЦІЯ</span>
        </a>
        <a href="#" class="activity-card activity-card-orange">
          <span class="activity-icon"><i class="bi bi-calculator"></i></span>
          <span class="activity-text">МАТЕМАТИКА</span>
        </a>
      </div>
    </section>
  </main>

  <div th:replace="include/footer :: footer"></div>

</body>
</html>
