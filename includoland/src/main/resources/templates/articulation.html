<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Артикуляція</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div th:replace="include/navbar :: navbar"></div>

  <main class="container py-5">
    <h1 class="mb-4">Артикуляційні активності</h1>
    <div class="row g-4">
      <div class="col-md-6 col-lg-4" th:each="content : ${contents}">
        <div class="card h-100 shadow-sm border-0 rounded-4">
          <img th:src="${content.pictureLink}" class="card-img-top rounded-top-4" alt="Activity image" style="height: 220px; object-fit: cover;">
          <div class="card-body">
            <h5 class="card-title" th:text="${content.title}">Назва</h5>
            <p class="card-text" th:text="${content.textData}">Опис</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="include/footer :: footer"></div>
</body>
</html>
