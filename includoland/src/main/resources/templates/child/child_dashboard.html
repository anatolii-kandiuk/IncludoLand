<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кабінет дитини</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div th:replace="include/navbar :: navbar"></div>

  <main class="container py-5">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card rounded-4 shadow-sm border-0 p-4">
          <h2 class="fw-bold mb-3"><i class="bi bi-person-heart me-2"></i>Мій кабінет</h2>
          <p class="text-muted">Вітаємо, <span class="fw-semibold" th:text="${user.firstName} + ' ' + ${user.lastName}">Ім'я Прізвище</span>!</p>
          <div class="list-group mt-3">
            <a href="#" class="list-group-item list-group-item-action rounded-3">
              <i class="bi bi-play-circle me-2"></i>Відкрити завдання
            </a>
            <a href="#" class="list-group-item list-group-item-action rounded-3">
              <i class="bi bi-bar-chart me-2"></i>Переглянути прогрес
            </a>
          </div>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card rounded-4 shadow-sm border-0 p-4">
          <h3 class="fw-semibold mb-3">Сьогоднішні активності</h3>
          <div class="row g-3">
            <div class="col-md-6">
              <div class="p-3 border rounded-3 bg-light">
                <h5 class="mb-2">Аудіо вправа</h5>
                <p class="mb-0 text-muted">10 хвилин</p>
              </div>
            </div>
            <div class="col-md-6">
              <div class="p-3 border rounded-3 bg-light">
                <h5 class="mb-2">Малювання</h5>
                <p class="mb-0 text-muted">15 хвилин</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="include/footer :: footer"></div>
</body>
</html>
