<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мій кабінет | IncludoLand</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .child-action-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            cursor: pointer;
        }
        .child-action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
        }
        .child-icon {
            font-size: 3.5rem;
        }
    </style>
</head>
<body class="bg-light">
    <div th:replace="include/navbar :: navbar"></div>

    <main class="container py-5">
        <div class="row mb-5 text-center justify-content-center">
            <div class="col-12">
                <h2 class="fw-bold mb-3">Вітаємо, <span th:text="${user.firstName}">Ім'я</span>! 🌟</h2>
                
                <div class="d-inline-flex align-items-center bg-white border border-light-subtle rounded-pill px-4 py-2 shadow-sm">
                    <i class="bi bi-person-badge-fill text-primary fs-4 me-2"></i>
                    <span class="text-muted me-2">Твій спеціаліст:</span>
                    <span class="fw-bold text-dark" th:text="${specialist != null ? specialist.firstName + ' ' + specialist.lastName : 'Очікуємо призначення'}">Олена Коваль</span>
                </div>
            </div>
        </div>
        <div class="row g-4 justify-content-center mb-5">
            
            <!-- Кнопка Активності -->
            <div class="col-md-4 col-sm-12">
                <a th:href="@{/child/activities}" class="card child-action-card h-100 border-0 rounded-4 shadow-sm bg-primary text-white text-center p-4">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center">
                        <i class="bi bi-controller child-icon mb-3"></i>
                        <h3 class="fw-bold m-0">Активності</h3>
                    </div>
                </a>
            </div>            
            <div class="col-md-4 col-sm-12">
                <a th:href="@{/child/progress}" class="card child-action-card h-100 border-0 rounded-4 shadow-sm bg-info text-white text-center p-4">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center">
                        <i class="bi bi-bar-chart-fill child-icon mb-3"></i>
                        <h3 class="fw-bold m-0">Прогрес</h3>
                    </div>
                </a>
            </div>
            <div class="col-md-4 col-sm-12">
                <a th:href="@{/child/rewards}" class="card child-action-card h-100 border-0 rounded-4 shadow-sm bg-warning text-dark text-center p-4">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center">
                        <i class="bi bi-trophy-fill child-icon mb-3 text-white"></i>
                        <h3 class="fw-bold m-0">Нагороди</h3>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <div th:replace="include/footer :: footer"></div>
</body>
</html>
