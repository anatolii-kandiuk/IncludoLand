<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кабінет спеціаліста</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div th:replace="include/navbar :: navbar"></div>

  <main class="container py-5">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card rounded-4 shadow-sm border-0 p-4 specialist-panel">
          <h2 class="fw-bold mb-3"><i class="bi bi-person-badge me-2"></i>Панель спеціаліста</h2>
          <p class="text-muted">Вітаємо, <span class="fw-semibold" th:text="${user.firstName} + ' ' + ${user.lastName}">Ім'я Прізвище</span>!</p>
          <button class="btn btn-primary rounded-pill w-100 mt-3">
            <i class="bi bi-plus-circle me-2"></i>Створити нове завдання / нотатку
          </button>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card rounded-4 shadow-sm border-0 p-4">
          <h3 class="fw-semibold mb-3">Мої вихованці</h3>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>ПІБ дитини</th>
                  <th>Останній результат</th>
                  <th>Статус</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Олена Коваль</td>
                  <td>Виконала 3 вправи</td>
                  <td><span class="badge bg-success">Активно</span></td>
                </tr>
                <tr>
                  <td>Микита Шевчук</td>
                  <td>Потребує уваги</td>
                  <td><span class="badge bg-warning text-dark">Потребує підтримки</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="include/footer :: footer"></div>
</body>
</html>
