<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Додати контент | IncludoLand</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">
    <div th:replace="include/navbar :: navbar"></div>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card rounded-4 shadow-sm border-0 p-4">   
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 class="fw-bold m-0"><i class="bi bi-file-earmark-plus me-2 text-primary"></i>Створити нове завдання</h3>
                        <a th:href="@{/specialist/dashboard}" class="btn btn-outline-secondary btn-sm rounded-pill">
                            <i class="bi bi-arrow-left"></i> Назад
                        </a>
                    </div>
                    <div th:if="${param.error}" class="alert alert-danger rounded-3">
                        Помилка під час завантаження медіафайлів. Спробуйте ще раз.
                    </div>
                    <form th:action="@{/specialist/content/add}" th:object="${content}" method="post" enctype="multipart/form-data">
                                                <div class="mb-3">
                            <label for="title" class="form-label fw-semibold">Назва активності</label>
                            <input type="text" class="form-control" id="title" th:field="*{title}" required placeholder="Наприклад: Вправа 'Годинник'">
                        </div>
                        <div class="mb-3">
                            <label for="textData" class="form-label fw-semibold">Опис / Інструкція</label>
                            <textarea class="form-control" id="textData" th:field="*{textData}" rows="4" required placeholder="Детальний опис того, що потрібно зробити..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="typeOfContent" class="form-label fw-semibold">Тип активності</label>
                            <select class="form-select" id="typeOfContent" th:field="*{typeOfContent}" required>
                                <option value="" disabled selected>Оберіть категорію...</option>
                                <option th:each="type : ${contentTypes}" 
                                        th:value="${type}" 
                                        th:text="${type}">
                                </option>
                            </select>
                        </div>
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label for="picture" class="form-label fw-semibold">Зображення (необов'язково)</label>
                                <input class="form-control" type="file" id="picture" name="picture" accept="image/*">
                            </div>
                            <div class="col-md-6 mt-3 mt-md-0">
                                <label for="audio" class="form-label fw-semibold">Аудіо (необов'язково)</label>
                                <input class="form-control" type="file" id="audio" name="audio" accept="audio/*">
                            </div>
                        </div>
                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" role="switch" id="isPublic" th:field="*{public}">
                            <label class="form-check-label fw-semibold" for="isPublic">Зробити активність публічною</label>
                        </div>
                        <button type="submit" class="btn btn-primary rounded-pill w-100 py-2 fw-bold">
                            <i class="bi bi-cloud-upload me-2"></i>Зберегти
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </main>
    <div th:replace="include/footer :: footer"></div>
</body>
</html>
