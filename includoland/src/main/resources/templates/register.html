<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реєстрація — IncludoLand</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <div th:replace="include/navbar :: navbar"></div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body p-4 p-md-5">
            <h2 class="text-center mb-4">Створити акаунт</h2>
            <form th:action="@{/register}" method="post" th:object="${user}">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Ім'я</label>
                  <input type="text" class="form-control" th:field="*{firstName}" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Прізвище</label>
                  <input type="text" class="form-control" th:field="*{lastName}" required>
                </div>
                <div class="col-12">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" th:field="*{email}" required>
                </div>
                <div class="col-12">
                  <label class="form-label">Пароль</label>
                  <input type="password" class="form-control" th:field="*{password}" required>
                </div>
                <div class="col-12">
                  <label class="form-label">Роль</label>
                  <select class="form-select" th:field="*{role}">
                    <option value="SPECIALIST">Спеціаліст</option>
                    <option value="CHILD">Дитина</option>
                  </select>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 rounded-pill mt-4">Зареєструватися</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="include/footer :: footer"></div>
</body>
</html>
